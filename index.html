<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney Princess Slots</title>
    <link rel="stylesheet" href="./src/style.css"> <!-- Link to Tailwind CSS -->
    <style>
        /* Basic styling to center canvas and remove margin */
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #222; }
        canvas { border: 1px solid black; background-color: white; }
        /* Hide overlay initially */
        #settings-overlay { display: none; }
    </style>
</head>
<body>
    <!-- Canvas for PixiJS rendering -->
    <canvas id="pixi-canvas"></canvas>

    <!-- HTML Overlay for Settings (Styled with Tailwind) -->
    <div id="settings-overlay" class="absolute inset-0 bg-black bg-opacity-75 flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg text-black w-1/3 min-w-[300px]">
            <h2 class="text-2xl font-bold mb-4">Bet Settings</h2>
            <!-- Settings content will go here -->
            <p>Coin Size: <button class="bg-gray-300 px-2 rounded">-</button> <span id="coin-size-value">0.05</span> <button class="bg-gray-300 px-2 rounded">+</button></p>
            <p>Coins/Line: <button class="bg-gray-300 px-2 rounded">-</button> <span id="coins-line-value">4</span> <button class="bg-gray-300 px-2 rounded">+</button></p>
            <p>Lines: <button class="bg-gray-300 px-2 rounded">-</button> <span id="lines-value">25</span> <button class="bg-gray-300 px-2 rounded">+</button></p>
            <button id="close-overlay-button" class="mt-4 bg-red-500 text-white px-4 py-2 rounded">Close</button>
        </div>
    </div>

    <!-- Link to bundled TypeScript code -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
